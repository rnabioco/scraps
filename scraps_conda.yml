name: scraps_conda
channels:
  - conda-forge
  - bioconda
dependencies:
  # Snakemake 9 requires Python >= 3.11
  - python >= 3.11
  - snakemake >=9,<10
  # per-rule SLURM submission via profiles/slurm (optional; local runs need nothing)
  - snakemake-executor-plugin-slurm
  - bedtools >= 2.30.0
  - cutadapt >= 3.4
  - multiqc >= 1.6
  - samtools >= 1.15
  - pysam >= 0.16.0
  - subread >= 2.0.1
  # umi_tools is used as a LIBRARY (network.UMIClusterer) by
  # inst/scripts/count_sites.py to reproduce directional UMI collapsing; its CLI
  # is only used by tests/validate_synthetic.sh and tests/validate_realdata.sh.
  - umi_tools >= 1.1.2
  - star >= 2.7.9a
  - zsh
  # for de novo RT priming site discovery (rules/discovery.snake)
  - numpy
  - pandas
  - scipy
  - scikit-learn
