on:
  push:
  pull_request:

name: snakemake-run

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        channels: conda-forge,bioconda
        channel-priority: strict
        auto-activate-base: false

    - name: Create conda environment
      shell: bash -el {0}
      run: |
        conda env create -f scraps_conda.yml

    - name: Dry-run (local execution)
      shell: bash -el {0}
      run: |
        conda activate scraps_conda
        conda info
        snakemake --version
        snakemake -np --configfile config.yaml

    - name: Dry-run (SLURM profile)
      shell: bash -el {0}
      run: |
        conda activate scraps_conda
        snakemake -n --profile profiles/slurm --configfile config.yaml
