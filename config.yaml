# config for scraps snakemake pipeline #

DATA: 
# Data folder containing FASTQs
  "sample_data/raw_data"

RESULTS:
# results directory
  "results"

STAR:
# path to STAR executable, if not in PATH
  "STAR"

STAR_INDEX:
# path to STAR genome index
  "ref/cr2020A_star/"

POLYA_SITES:
# polya_db 3 on GRCh38. The provided SAF references (and anything written by the
# converters in inst/scripts/polyadb/) carry -10/+5 transcript slop around the
# annotated cleavage site (genomic Start = pos - 5, End = pos + 10 on the minus
# strand, mirrored on the plus strand), i.e. 10 bp upstream and 5 bp downstream
# of the cleavage site in the direction of transcription (16 bases inclusive).
# The single-base cleavage position is encoded in field 5 of the ';'- (hg38) or
# '_'- (mm10) delimited GeneID. A file not ending in .saf/.saf.gz is passed to
# featureCounts as GTF.
  "ref/polyadb32.hg38.saf.gz"
   
#POLYA_FORMAT:
# SAF or GTF, currently auto detecting filename .saf or .saf.gz, case-insensitive
#   "SAF"

GENOME_FASTA:
# Genome FASTA (with .fai index) matching the alignment reference.
# Required ONLY when DISCOVERY.enabled is true; used for sequence-context
# annotation (PAS motif scan, downstream A-content) of RT priming sites.
# Chromosome names must match those in the alignment BAMs / discovery beds.
#   "ref/genome.fa"

DISCOVERY:
# De novo RT priming site discovery (optional, off by default).
# Identifies RT priming sites via kernel density estimation (KDE) on
# pseudobulked, UMI-deduplicated, strand-aware single-base priming positions,
# then annotates each site as one of:
#   known_pas                  - matches a validated polyAdb cleavage/polyA site
#   suspected_internal_priming - downstream genomic A-content/A-run; may be
#                                oligo-dT internal priming OR a genuine site in
#                                an A-tract (not resolvable from sequence)
#   potential_novel_pas        - no A-rich signature + upstream PAS motif
#   potential_novel_no_pas     - no A-rich signature, no PAS (lower confidence)
# NOTE: validated poly(A) sites (POLYA_SITES / polyAdb) remain the recommended
# reference for downstream QUANTITATIVE analyses. Discovered sites are
# candidates for hypothesis generation and require orthogonal validation;
# suspected_internal_priming sites are ambiguous: interpret with caution rather
# than discarding them by default.
# See docs/discovery.md for full details.
  enabled: false
  # Which alignment mode(s)' priming beds feed discovery. Accepts a single mode
  # (R1, R2, paired, or bam) OR a list; each sample runs only the modes it was
  # actually aligned in (intersected with its `alignments`). Per-sample override
  # via SAMPLES.<name>.discovery_read. If `read` is unset, a sample's own
  # `alignments` are used. Each (sample, mode) yields a separate discovery track
  # named "<sample>_<mode>" (e.g. AEG1_R2_sites.tsv.gz).
  read: R2
  #  example (multi-mode): read: [R2, paired]
  # optional named pools of samples aggregated into one track PER shared mode;
  # each yields "<group>_<mode>". Samples not listed are processed individually.
  groups: {}
  #  example:
  #  groups:
  #    groupA: [chromiumv2_test, dropseq_test]
  # optional explicit units: aggregate ARBITRARY (sample, mode) stranded beds
  # into one named track (cross-sample and/or cross-mode). Once stranded beds
  # exist they share a common transcript-oriented coordinate system, so any set
  # can be summed. CAVEAT: pooling multiple modes that derive from the SAME
  # underlying reads double-counts UMI support (the same molecule counted under
  # each mode) - only pool modes that are independent measurements.
  units: {}
  #  example:
  #  units:
  #    cv2_allmodes: [[chromiumv2_test, R2], [chromiumv2_test, paired]]
  # KDE Gaussian bandwidth in bp (smoothing scale of priming signal)
  kde_bandwidth: 10
  # minimum summed UMI support per called peak. Discovery is pseudobulk (summed
  # over all cells, and over pooled samples). The support floor is
  # max(min_umi, min_umi_frac * total_pooled_UMIs). min_umi is the PRIMARY,
  # absolute floor and the main control on peak count. min_umi_frac is an
  # OPTIONAL depth-relative term, OFF by default (0): it scales linearly with
  # sequencing depth/pooling, so on deep or pooled data it imposes a very high
  # absolute bar (e.g. 1e-6 * 1e8 = 100 UMIs/peak) that silently drops usable
  # mid-abundance peaks. Set a small positive value only if you deliberately
  # want the bar to scale with depth; the min_density shape gate (below) already
  # suppresses isolated single-UMI bumps.
  min_umi: 10
  min_umi_frac: 0.0
  # minimum KDE density (per-base, UMI-weighted) for a peak to be called. This
  # is a secondary shape gate; 0 / omitted -> derived from kde_bandwidth
  # (~2 UMIs concentrated within one bandwidth) so isolated single-UMI bumps
  # cannot form a called maximum. Set a positive value to override.
  min_density: 0.0
  # collapse called maxima within this distance (bp) into one summit
  peak_merge_dist: 24
  # summit placement within a called cluster:
  #   downstream (default) - snap the summit to the transcript-3' cleavage
  #     boundary: the most-downstream base whose depth >= summit_frac * cluster
  #     peak depth, searched over the full occupied read pileup. 3'-end read
  #     pileups have a hard boundary at the cleavage site and tail upstream, so
  #     the smoothed-density maximum is biased ~1-2 bp upstream; this removes
  #     that bias (polyAdb exact-hit rate ~25% -> ~65% at summit_frac 0.75).
  #     kde_score column is then the raw UMI depth at the summit.
  #   kde - legacy smoothed-density-maximum summit (kde_score = density).
  summit_method: downstream
  # downstream-method depth threshold as a fraction of the cluster peak depth
  # (default 0.75, empirically minimizes summit-vs-polyAdb offset)
  summit_frac: 0.75
  # strand-aware [upstream, downstream] bp window for calling a discovered
  # summit a known polyAdb site. Asymmetric (read distributions are skewed);
  # offsets are transcript-oriented. Default [10, 5] matches the slop of the
  # provided polyAdb SAF references.
  match_window: [10, 5]
  # transcript-oriented [upstream, downstream] slop applied to each summit when
  # writing the de novo SAF (output feature window). Default [10, 5] reproduces
  # the -10/+5 footprint of the provided polyAdb SAF references.
  saf_slop: [10, 5]
  # upstream window [start, end] (bp, relative to summit) scanned for PAS motif
  pas_window: [-40, 0]
  # downstream window [start, end] (bp, relative to summit) for A-content
  a_content_window: [1, 20]
  # downstream A fraction at/above which a site is flagged suspected_internal_priming
  a_content_max: 0.7

DEFAULTS:
# default config options, overridden by SAMPLES and CHEMISTRY definitions
  platform: illumina
  chemistry: chromiumV3
  alignments:
    - R2
    - paired
  # R2-arm behaviour (platform blocks in chemistry.yaml override these):
  #   R2_polyA_filter   - require a soft-clipped poly(A) tail on R2 alignments
  #                       (inst/scripts/filter_bam.py). false for chemistries
  #                       whose reads cannot carry one (ultima_fastq).
  #   R2_priming_offset - bp to move the R2 3' end in the transcript-3'
  #                       direction before site assignment and pileup
  #                       (featureCounts --readShiftType downstream /
  #                       pileup_sites.py --shift). 5 for ultima_fastq.
  R2_polyA_filter: true
  R2_priming_offset: 0
  # bam mode (pre-aligned, CB/UB-tagged BAM input; `alignments: [bam]`,
  # platform `generic`). Four supported classes, by read strand vs transcript
  # and the required soft clip at the counted end:
  #   bam_strand: same    + bam_polyA_filter: false  (1) count read 3' end
  #   bam_strand: same    + bam_polyA_filter: true   (2) ... + 3' poly(A) clip required
  #   bam_strand: reverse + bam_polyA_filter: false  (3) count read 5' end
  #   bam_strand: reverse + bam_polyA_filter: true   (4) ... + 5' poly(T) clip required
  # bam_mate: 0 for single-end BAMs; 1 or 2 for paired-end BAMs = the mate that
  # carries the priming site (bam_strand/bam_polyA_filter describe that mate;
  # proper pairs only, the other mate is dropped, positions are per fragment).
  # bam_priming_offset: bp the priming site lies beyond the counted read end.
  # ASSUMED, not enforced: full-length molecules, CB/UB tags, accurate strand.
  # STAR_mem_mb: STARsolo job memory (MB). Unset = genome index size + 16 GB
  # BAM-sort buffer + 4 GB headroom; --limitBAMsortRAM is derived from it.
  # Set here, per sample, or per platform for large libraries, e.g.
  # STAR_mem_mb: 96000
  bam_mate: 0
  bam_strand: same
  bam_polyA_filter: false
  bam_priming_offset: 0

SAMPLES:
# per-sample labels, FASTQ basenames, and config options
# required (FASTQ modes R1/R2/paired):
#   basename  (FASTQ prefix under DATA, globbed as {basename}*R1*; may be a list)
# required (bam mode):
#   bam       (input BAM, absolute or relative to DATA)
# optional (any chemistry/platform key may also be overridden per sample):
#   chemistry, platform
#   alignments
#   discovery_read (per-sample override of DISCOVERY.read)
#   bam_mate, bam_strand, bam_polyA_filter, bam_priming_offset - see DEFAULTS
#   bc_whitelist, bc_cut, bc_length1
#   cutadapt_R1, cutadapt_paired (cutadapt arguments; empty -> no trimming)
#   STAR_R1, STAR_R2, STAR_paired
#     STAR_R1 is single-mate: --clip5pNbases takes ONE value.
#     STAR_paired is two-mate: --clip5pNbases takes TWO values (<R1clip> 0).
#   extra STAR args (STAR_R1_extra_args, STAR_R2_extra_args, STAR_paired_extra_args)
#   R2_polyA_filter (true/false), R2_priming_offset (int bp) - see DEFAULTS
  chromiumv2_test:
    basename: sample-
    platform: illumina
    chemistry: chromiumV2
  dropseq_test:
    basename: dropseq
    platform: illumina
    chemistry: dropseq
    alignments:
      - R2
  microwell_test3:
    basename: microwellseq
    platform: illumina
    chemistry: microwellseq
  chromiumv3_ultima_test:
    # CRAM-derived Ultima reads: one long read (adapter+CB+UMI+cDNA), R1 arm
    basename: ultima
    platform: ultima_cram
    chemistry: chromiumV3
    alignments:
      - R1
  chromiumv3_ultima_fastq_test:
    # Ultima-delivered pseudo-paired FASTQs (R1 = CB+UMI, R2 = cDNA), R2 arm.
    # Dry-run fixture only (no FASTQs in sample_data). The basename must not
    # start with "ultima": chromiumv3_ultima_test globs ultima*R1*.
    basename: ugfastq
    platform: ultima_fastq
    chemistry: chromiumV3
    alignments:
      - R2
  # pre-aligned BAM fixtures (bam mode). All point at one tiny synthetic BAM
  # shipped in sample_data so the dry-run DAG resolves; content is irrelevant.
  bam_sense_test:
    # class 1, single-end: read on the transcript strand, count 3' end, no clip filter
    bam: synthetic_longread.bam
    platform: generic
    chemistry: chromiumV3
    alignments:
      - bam
  bam_antisense_test:
    # class 4, single-end: antisense read, count 5' end, 5' poly(T) clip required
    bam: synthetic_longread.bam
    platform: generic
    chemistry: chromiumV3
    alignments:
      - bam
    bam_strand: reverse
    bam_polyA_filter: true
  bam_paired_test:
    # class 3 on mate 1 of a paired-end BAM (10x-like: read1 5' end is the site)
    bam: synthetic_longread.bam
    platform: generic
    chemistry: chromiumV3
    alignments:
      - bam
    bam_mate: 1
    bam_strand: reverse

# multiqc section order: used only by rule qc_check (rules/qc.snake), which is
# not part of the default `all` target
report_section_order:
  cutadapt:
    order: 1000
  star:
    order: 100
  featureCounts:
    order: -1000
